name: Live stability
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-stability
  cancel-in-progress: false
jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # No installation, credentials, forced sync, real order or payment.
      - run: node scripts/verify-live-stability.mjs --output artifacts/live-stability.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-stability-${{ github.run_id }}
          path: artifacts/live-stability.json
          retention-days: 14
