name: Release checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  critical-checks-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TM_DISABLE_BACKGROUND_WORKERS: '1'
      TM_DISABLE_INDEXNOW: '1'
      OPENAI_ASSISTANT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:security
      - run: npm run test:dpd
      - run: npm run test:price-history
      - run: npm run test:migration
      - run: node --experimental-strip-types --test scripts/production-readiness.test.ts scripts/performance-accessibility-regression.test.ts
      # npm prebuild runs the isolated release guard and blocks Astro on failure.
      - run: npm run build
      - run: npm audit --omit=dev
  node-22-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TM_DISABLE_BACKGROUND_WORKERS: '1'
      TM_DISABLE_INDEXNOW: '1'
      OPENAI_ASSISTANT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run build
      - run: npm audit --omit=dev
