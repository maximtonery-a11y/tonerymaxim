name: Release checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  critical-checks-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TM_DISABLE_BACKGROUND_WORKERS: '1'
      TM_DISABLE_INDEXNOW: '1'
      OPENAI_ASSISTANT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test scripts/ai-tomas-v2-conversation-acceptance.test.ts
      - run: npm run check
      # npm prebuild runs the isolated release guard and blocks Astro on failure.
      - run: npm run build
